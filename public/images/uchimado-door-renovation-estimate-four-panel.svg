<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
  <title id="title">大きな窓の4枚建て内窓の取付位置</title>
  <desc id="desc">上段は室内から見た4枚建ての内窓の形。下段は上から見た位置関係で、青灰色の既存の外窓を残し、その室内側に赤色の内窓を追加する。寸法や納まりを確定した施工図ではない。</desc>
  <rect width="640" height="780" rx="20" fill="#fffdf9"/>
  <g font-family="'Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Yu Gothic',sans-serif" fill="#343434" text-anchor="middle">
    <text x="320" y="49" font-size="32" font-weight="700">大きな窓の4枚建て内窓</text>
    <rect x="41" y="79" width="28" height="21" rx="3" fill="#607b8b"/>
    <text x="157" y="102" font-size="28">既存の窓</text>
    <rect x="349" y="79" width="28" height="21" rx="3" fill="#b83f42"/>
    <text x="465" y="102" font-size="28">新設の内窓</text>
    <g stroke="#b83f42" fill="#fff1ee" stroke-width="6">
      <rect x="40" y="139" width="560" height="215" rx="2"/>
      <rect x="48" y="147" width="135" height="199"/>
      <rect x="184" y="147" width="136" height="199"/>
      <rect x="320" y="147" width="136" height="199"/>
      <rect x="457" y="147" width="135" height="199"/>
    </g>
    <g stroke="#b83f42" stroke-width="5" stroke-linecap="round">
      <path d="M307 242v26M333 242v26"/>
    </g>
    <text x="320" y="397" font-size="28">室内から見た形（4枚建て）</text>
    <path d="M40 427H600" stroke="#e5ded5" stroke-width="2"/>
    <text x="320" y="473" font-size="30" font-weight="700">上から見た取付位置</text>
    <text x="320" y="517" font-size="27" fill="#606060">屋外側</text>
    <g stroke="#607b8b" stroke-width="5" fill="#e7eff3">
      <rect x="70" y="542" width="500" height="19"/>
      <path d="M195 542v19m125-19v19m125-19v19"/>
    </g>
    <text x="320" y="600" font-size="28" fill="#415d6d">既存の外窓は残す</text>
    <g stroke="#b83f42" stroke-width="5" fill="#fff1ee">
      <rect x="70" y="631" width="500" height="19"/>
      <path d="M195 631v19m125-19v19m125-19v19"/>
    </g>
    <text x="320" y="691" font-size="28" fill="#9b3034">新設の内窓（室内側）</text>
    <text x="320" y="751" font-size="25" fill="#64605b">取付位置を示す模式図</text>
  </g>
</svg>
