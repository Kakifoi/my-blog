<svg xmlns="http://www.w3.org/2000/svg" width="640" height="830" viewBox="0 0 640 830" role="img" aria-labelledby="bay-title bay-desc">
  <title id="bay-title">出窓は、棚の手前を仕切る</title>
  <desc id="bay-desc">室内から斜め上に見た、取付位置を示す模式図。奥正面と左右の小窓は青灰色、残す出窓の棚は木色で示す。その手前の室内側にだけ、赤色の平面の2枚建て内窓を追加する。透明なガラス越しに棚と既存の3面の窓が見え、奥の窓と新しい内窓の間に奥行きがある。左右の側面には内窓を付けない。寸法や納まりを確定した施工図ではない。</desc>
  <rect width="640" height="830" rx="20" fill="#fffdf9"/>
  <g font-family="'Hiragino Kaku Gothic ProN','Noto Sans CJK JP','Yu Gothic',sans-serif" text-anchor="middle" stroke-linecap="round" stroke-linejoin="round">
    <text x="320" y="49" fill="#343434" font-size="31" font-weight="700">出窓は、棚の手前を仕切る</text>

    <rect x="22" y="79" width="596" height="69" rx="13" fill="#eaf0f2"/>
    <text x="320" y="123" fill="#607b8b" font-size="30" font-weight="700">① 奥と左右の窓・棚は残す</text>
    <path d="M270 148V210" fill="none" stroke="#607b8b" stroke-width="3"/>
    <circle cx="270" cy="210" r="5" fill="#607b8b"/>

    <!-- One continuous shelf, visible through the new front glazing. -->
    <path d="M270 380L570 446L394 557L68 485Z" fill="#f4e7ce" stroke="#cdb58d" stroke-width="3"/>
    <path d="M68 485L394 557V570L68 498Z" fill="#e3cda8" stroke="#cdb58d" stroke-width="2"/>

    <!-- Retained exterior windows: rear face and two side faces only. -->
    <g stroke="#607b8b" stroke-width="6">
      <path d="M270 210L570 276V446L270 380Z" fill="#607b8b" fill-opacity="0.045"/>
      <path d="M270 210L68 312V485L270 380Z" fill="#607b8b" fill-opacity="0.025"/>
      <path d="M570 276L394 384V557L570 446Z" fill="#607b8b" fill-opacity="0.035"/>
    </g>

    <!-- The only new window is this single flat, two-panel front plane. -->
    <path d="M68 312L394 384V557L68 485Z" fill="#b83f42" fill-opacity="0.018"/>
    <g fill="none" stroke="#b83f42" stroke-width="9">
      <path d="M68 312L394 384V557L68 485Z"/>
      <path d="M231 348V521"/>
    </g>

    <!-- Short horizontal labels remain readable at phone width. -->
    <g fill="#607b8b" font-size="29" font-weight="700">
      <text x="425" y="296">奥の窓</text>
      <text x="137" y="365">小窓</text>
      <text x="490" y="400">小窓</text>
    </g>
    <text x="311" y="489" fill="#765f42" font-size="28" font-weight="700">出窓の棚</text>
    <text x="110" y="568" fill="#64605b" font-size="25">室内側</text>

    <path d="M231 527V595H320V619" fill="none" stroke="#b83f42" stroke-width="3"/>
    <circle cx="231" cy="527" r="5" fill="#b83f42"/>
    <rect x="22" y="619" width="596" height="69" rx="13" fill="#fae9e7"/>
    <text x="320" y="663" fill="#b83f42" font-size="30" font-weight="700">② 手前に平面の2枚建て内窓</text>

    <text x="320" y="735" fill="#343434" font-size="29" font-weight="700">側面に内窓は付けない</text>
    <text x="320" y="780" fill="#64605b" font-size="26">取付位置を示す模式図</text>
    <text x="320" y="815" fill="#64605b" font-size="25">寸法・納まりを示す施工図ではありません</text>
  </g>
</svg>
